behaviors:
  HeliControll:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 81920
      learning_rate: 0.00015
      beta: 0.001
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 516
      num_layers: 2
      vis_encode_type: simple
      memory:
        memory_size: 128
        sequence_length: 64
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 1000000
    max_steps: 20000000
    time_horizon: 900
    summary_freq: 30000
    self_play:
      save_steps: 150000
      team_change: 750000
      swap_steps: 10000
      window: 25
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
