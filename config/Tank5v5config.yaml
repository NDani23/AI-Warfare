behaviors:
  TankControll:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0002
      beta: 0.001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 5
      vis_encode_type: simple
      # memory:
      #   sequence_length: 16
      #   memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 1000000
    max_steps: 50000000
    time_horizon: 750
    summary_freq: 30000
    self_play:
      save_steps: 100000
      team_change: 100000
      swap_steps: 3000
      window: 15
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
